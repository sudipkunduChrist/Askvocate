<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Sample PAN card front">
  <defs>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16293f" />
      <stop offset="0.65" stop-color="#24425f" />
      <stop offset="1" stop-color="#1a3049" />
    </linearGradient>
    <pattern id="micro-lines" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 18 18 0" stroke="#b9ae96" stroke-width="0.6" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="900" height="560" fill="#ded5c2" />
  <rect width="900" height="560" fill="url(#micro-lines)" opacity="0.6" />
  <rect width="900" height="560" filter="url(#paper-grain)" opacity="0.07" />

  <g transform="rotate(-1 450 280)">
    <rect x="42" y="42" width="816" height="476" rx="20" fill="#faf5e9" stroke="#c2b79f" stroke-width="2" />
    <path d="M42 62a20 20 0 0 1 20-20h776a20 20 0 0 1 20 20v50H42V62Z" fill="url(#band)" />
    <text x="72" y="79" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="3.4" fill="#f5ecd7">INCOME TAX DEPARTMENT</text>
    <text x="72" y="108" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="1.4" fill="#ffffff">PERMANENT ACCOUNT NUMBER CARD</text>

    <g opacity="0.9">
      <circle cx="760" cy="86" r="30" fill="none" stroke="#e6c78a" stroke-width="1.4" />
      <circle cx="760" cy="86" r="22" fill="none" stroke="#e6c78a" stroke-width="0.8" stroke-dasharray="2 4" />
      <path d="M752 86h16M760 78v16" stroke="#e6c78a" stroke-width="1.2" />
    </g>

    <rect x="72" y="154" width="168" height="198" rx="4" fill="#d9d2c2" stroke="#b7ac94" stroke-width="1.5" />
    <circle cx="156" cy="216" r="42" fill="#b9b09c" />
    <path d="M94 352c4-48 30-70 62-70s58 22 62 70Z" fill="#b9b09c" />
    <text x="156" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#726a59">PHOTOGRAPH</text>

    <text x="286" y="175" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.4" fill="#6d6454">NAME</text>
    <text x="286" y="204" font-family="Georgia, serif" font-size="28" fill="#1b2a3d">AARAV MEHTA</text>

    <text x="286" y="244" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.4" fill="#6d6454">FATHER'S NAME</text>
    <text x="286" y="272" font-family="Georgia, serif" font-size="24" fill="#1b2a3d">RAJESH MEHTA</text>

    <text x="286" y="312" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.4" fill="#6d6454">DATE OF BIRTH</text>
    <text x="286" y="338" font-family="'IBM Plex Mono', Consolas, monospace" font-size="21" fill="#1b2a3d">14 / 08 / 1991</text>

    <text x="616" y="182" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.4" fill="#6d6454">PAN</text>
    <text x="616" y="222" font-family="'IBM Plex Mono', Consolas, monospace" font-size="31" font-weight="600" letter-spacing="2.2" fill="#8a2f25">BKRPM4821Q</text>

    <path d="M72 388h768" stroke="#d5cbb7" stroke-width="1" />
    <text x="72" y="414" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8a8070">SIGNATURE</text>
    <path d="M72 462c22-24 36 12 54-8s30 8 44-4 26 10 40 0" fill="none" stroke="#5d6a79" stroke-width="1.6" stroke-linecap="round" />
    <text x="596" y="430" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.6" fill="#8a8070">SAMPLE DOCUMENT · PREVIEW ONLY</text>
    <text x="596" y="450" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.6" fill="#a09682">NOT A VALID IDENTITY RECORD</text>

    <g opacity="0.1" transform="rotate(-16 450 280)">
      <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="18" fill="#8a2f25">DEMO</text>
    </g>
  </g>
</svg>
