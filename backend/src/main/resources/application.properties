spring.application.name=backend
server.address=0.0.0.0
server.port=8080
logging.level.com.askvocate.backend.service.OcrExtractionService=DEBUG

spring.data.mongodb.uri=${MONGO_URL}

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-this}
jwt.expiration=86400000

# AWS S3 (file storage)
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.presign-duration-days=${AWS_S3_PRESIGN_DURATION_DAYS:7}

# Google Sign-In: the Web OAuth client ID that Android ID tokens must be issued for.
# Paste the "Web application" client ID from Google Cloud Console here.
google.oauth.web-client-id=${GOOGLE_WEB_CLIENT_ID}

# Spring Boot file size limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=64MB

verification.python-executable=${VERIFICATION_PYTHON:auto}
verification.worker-path=${VERIFICATION_WORKER_PATH:}
verification.aadhaar-hash-key=${AADHAAR_HASH_KEY:}
verification.admin-password=${ADMIN_PASSWORD:askvocate-admin}
verification.degree.allowlist-enabled=${DEGREE_ALLOWLIST_ENABLED:true}
verification.degree.registry-path=${DEGREE_REGISTRY_PATH:}

# Bar Council / Advocate Verification API (Sandbox.co.in / Surepass)
barcouncil.api.enabled=${BAR_COUNCIL_API_ENABLED:true}
barcouncil.api.key=${SANDBOX_API_KEY:}
barcouncil.api.url=${BAR_COUNCIL_API_URL:https://api.sandbox.co.in/kyc/advocate/verify}
